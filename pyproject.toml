[project]
name = "gridiron-iq"
version = "0.1.0"
description = "NFL cap-efficiency (Boardroom) and post-game film (Film Room) analytics."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # --- data + storage ---
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",          # read nflverse parquet release assets
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    # --- modeling / viz (Boardroom) ---
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # --- Film Room natural-language layer ---
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # --- app ---
    "streamlit>=1.35",       # needs plotly_chart on_select (click events)
    "plotly>=5.20",          # interactive football-field view
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Warehouse layer (dbt). dev target = DuckDB; add dbt-databricks for prod.
warehouse = ["dbt-duckdb>=1.8", "duckdb>=1.0"]
# Prod warehouse on Databricks (Delta + Unity Catalog). Pulls the SQL connector.
databricks = ["dbt-databricks>=1.8"]
# Orchestration layer (Dagster) — unifies ingestion + dbt + modeling assets.
orchestration = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
    "dagster-duckdb>=0.25",
]
# PBP lakehouse (PySpark + Delta medallion). Needs Java 11/17 locally; pyspark +
# Delta ship with the Databricks runtime.
spark = ["pyspark>=3.5", "delta-spark>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py310"
