version: 2

models:
  - name: stg_positional_spending
    description: Typed, keyed team x season x position-group cap spending.
    columns:
      - name: spend_sk
        description: Surrogate key — one row per season/team/pos_group (the grain).
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: team
        data_tests: [not_null]
      - name: pos_group
        description: Position group bucket.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [QB, RB, WR, TE, OL, IDL, EDGE, LB, CB, S, SPEC, UNK]
      - name: cap_pct
        description: Share of the season's league cap (must be a valid 0..1 fraction).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

  - name: stg_team_outcomes
    description: Supervised SB target per team-season.
    columns:
      - name: team_season_sk
        data_tests: [unique, not_null]
      - name: sb_win
        data_tests:
          - accepted_values: { arguments: { values: [0, 1] } }
      - name: sb_appearance
        data_tests:
          - accepted_values: { arguments: { values: [0, 1] } }
      - name: season
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_league_cap')
                field: season

  - name: stg_spending_features
    description: Wide per-team-season positional cap-share matrix.
    columns:
      - name: team_season_sk
        data_tests: [unique, not_null]
      - name: pct_qb
        data_tests: [not_null]

  - name: stg_league_cap
    description: Per-season league cap and era labels.
    columns:
      - name: season
        data_tests: [unique, not_null]
