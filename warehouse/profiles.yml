# dbt connection profiles for GridironIQ.
# Run dbt from this directory with:  dbt build --profiles-dir .
#
# DEV  = DuckDB. Zero-cost, embedded, columnar. Iterate here.
# PROD = Databricks. Uncomment once you've created a free Databricks workspace,
#        set DATABRICKS_HOST / DATABRICKS_HTTP_PATH / DATABRICKS_TOKEN in your
#        environment, then run:  dbt build --profiles-dir . --target prod
# The SAME models run against both — that portability is the whole point.

gridiron:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/warehouse.duckdb"
      schema: main
      threads: 4

    # PROD = Databricks (Delta + Unity Catalog). Reads credentials from the
    # environment — the token never lives in this file or in git:
    #   export DATABRICKS_HOST=adb-xxxx.azuredatabricks.net   (no https://)
    #   export DATABRICKS_HTTP_PATH=/sql/1.0/warehouses/xxxx
    #   export DATABRICKS_TOKEN=dapi...                       (in your shell only)
    # then:  dbt build --profiles-dir . --target prod
    prod:
      type: databricks
      # Empty defaults so the dev target still renders when these are unset;
      # a real prod run requires them exported (see DATABRICKS.md).
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'gridiron') }}"   # Unity Catalog
      schema: marts
      threads: 4
