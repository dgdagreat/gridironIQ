# Databricks Asset Bundle — schedules the PBP medallion as a SERVERLESS Databricks Job.
#
# Free Edition is serverless-only, so this runs the medallion NOTEBOOK
# (./databricks/pbp_medallion.py) on serverless compute — no cluster to size, no
# dependencies to install (pyspark + Delta + pandas ship with the runtime). The
# notebook creates the catalog/schema/volume, fetches raw PBP, and writes the
# Bronze/Silver/Gold Delta tables under <catalog>.<schema>.
#
# Deploy (needs the Databricks CLI + DATABRICKS_HOST/DATABRICKS_TOKEN in your env):
#   cd lakehouse
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run pbp_medallion -t dev      # run it once now

bundle:
  name: gridiron-pbp-medallion

resources:
  jobs:
    pbp_medallion:
      name: gridiron-pbp-medallion
      # Daily and idempotent (overwrite). PBP for completed games settles within a day.
      schedule:
        quartz_cron_expression: "0 0 14 * * ?"   # 14:00 UTC daily
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: medallion
          # No cluster / job_cluster specified -> the task runs on serverless compute.
          notebook_task:
            notebook_path: ./databricks/pbp_medallion.py
            base_parameters:
              catalog: gridiron
              schema: pbp
              start_season: "2015"
              end_season: "2025"

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
