# Local dev: `docker compose up dagster` → Dagster UI at http://localhost:3000
# The pipeline profile runs the warehouse build once and exits.
services:
  dagster:
    build: .
    image: gridironiq:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data          # mount your local SQLite/DuckDB/parquet
      # Live-reload the source: edit on the host, hit "Reload definitions" in the
      # UI — no image rebuild. warehouse/ is intentionally NOT mounted so the
      # image's baked dbt_packages/ stays (host warehouse/ has none — it's
      # gitignored). To iterate on dbt models too: run `cd warehouse &&
      # ../.venv/bin/dbt deps` on the host once, then add `- ./warehouse:/app/warehouse`.
      - ./gridiron:/app/gridiron
      - ./orchestration:/app/orchestration
      - ./scripts:/app/scripts
    env_file:
      - .env                      # ANTHROPIC_API_KEY for the scouting agent
    environment:
      DAGSTER_HOME: /app/.dagster_home

  # One-shot: build + test the warehouse (dbt), then exit.
  pipeline:
    image: gridironiq:latest
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
    command: ["python", "warehouse/build.py"]
